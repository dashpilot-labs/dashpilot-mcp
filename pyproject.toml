[project]
name = "dashpilot-mcp"
version = "0.0.3"
description = "DoorDash Drive automation for AI agents — quote, dispatch, track, schedule, and batch deliveries for restaurants (unofficial)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=2,<3",
    "httpx2>=2.5",
]

[project.scripts]
dashpilot-mcp = "dashpilot_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dashpilot_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
